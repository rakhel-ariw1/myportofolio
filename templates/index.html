{% extends 'base.html' %}

{% block content %}
<main>
    <section class="hero" id="profile">
        <div class="container hero-grid">
            <div class="hero-identity">
                <p class="hero-kicker">Information Systems &middot; Universitas Indonesia</p>
                <h1>{{ name }}</h1>
            </div>
            <div class="hero-photo">
                <img class="avatar" src="/static/img/rakhelimut.jpeg" alt="Photo of {{ name }}">
                <div class="social-links">
                    <a href="https://github.com/rakhel-ariw1" class="social-link">GitHub</a>
                    <a href="https://www.linkedin.com/in/rakhel-aqeela-hapsari-ariwibowo-5611a136b/" class="social-link">LinkedIn</a>
                    <a href="mailto:ariwiboworakhel@example.com" class="social-link">Email</a>
                </div>
            </div>
            <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                </div>
        </div>
    </section>
</main>
{% endblock %}
